name: Deploy to Staging

on:
  push:
    branches:
      - staging
  # Manual trigger. On 2026-08-26 an Actions outage left a run wedged in `queued` with
  # zero jobs — it could not be rerun ("already running") or cancelled ("already
  # completed"), so the required `deploy` check had no way to report and the PR was
  # stuck. With push as the only trigger, the sole remedy was another push.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations against staging
        run: supabase db push --db-url "$STAGING_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

      - name: Deploy edge functions to staging
        run: |
          for fn in create-user update-user send-email daily-digest upload-to-drive sync-roorides-vehicles backup-to-drive; do
            supabase functions deploy $fn --project-ref "$STAGING_PROJECT_REF" --no-verify-jwt
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
