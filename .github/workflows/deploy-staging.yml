name: Deploy to Staging

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Repair migration history
        run: supabase db query --db-url "$STAGING_DB_URL" "TRUNCATE supabase_migrations.schema_migrations;"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

      - name: Run migrations against staging
        run: supabase db push --db-url "$STAGING_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

      - name: Deploy edge functions to staging
        run: |
          for fn in create-user send-email daily-digest upload-to-drive sync-roorides-vehicles backup-to-drive; do
            supabase functions deploy $fn --project-ref "$STAGING_PROJECT_REF" --no-verify-jwt
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
