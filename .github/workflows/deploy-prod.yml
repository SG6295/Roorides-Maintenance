name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run migrations against production
        run: supabase db push --db-url "$PROD_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}

      - name: Deploy edge functions to production
        run: |
          for fn in create-user update-user send-email daily-digest upload-to-drive sync-roorides-vehicles backup-to-drive; do
            supabase functions deploy $fn --project-ref "$PROD_PROJECT_REF" --no-verify-jwt
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PROJECT_REF: ${{ secrets.PROD_PROJECT_REF }}
